[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "serpent-hype-coin-engine"
version = "0.1.0"
description = "Local-first dual-score crypto intelligence system for speculative token research."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "tenacity>=8.5",
  "structlog>=24.2",
  "redis>=5.0",
  "rq>=1.16",
  "apscheduler>=3.10",
  "polars>=1.0",
  "pandas>=2.2",
  "duckdb>=1.0",
  "numpy>=2.0",
  "scipy>=1.14",
  "scikit-learn>=1.5",
  "networkx>=3.3",
  "web3>=7.0",
  "eth-utils>=5.0",
  "base58>=2.1",
  "boto3>=1.34",
  "streamlit>=1.37",
  "plotly>=5.23",
  "feedparser>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "freezegun>=1.5",
  "ruff>=0.5",
  "mypy>=1.10",
]
telegram = [
  "telethon>=1.34",
]

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "backtest*", "catalyst*", "common*", "engine*", "features*", "fingerprint*", "forecast*", "ingestion*", "mempool*", "narrative*", "ops*", "radar*", "risk_engine*", "scoring*", "storage*", "ui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
