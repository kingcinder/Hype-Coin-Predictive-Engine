# Production hardening overlay — apply on top of docker-compose.yml:
#
#   docker compose --env-file .env.prod \
#     -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Hardens the single-container stack: read-only root filesystem (only the
# named volumes and tmpfs are writable), dropped Linux capabilities, resource
# limits, bounded log rotation, and secrets via a dedicated env file.  The
# backup sidecar is kept but given the same resource/security posture.
#
# Requires a .env.prod file (see INSTALL.md) holding secrets such as
# HELIUS_API_KEY, ETHERSCAN_API_KEY, NTFY_TOPIC, FARCASTER_API_KEY, etc.,
# plus BIRDEYE_API_KEY: the engine service below refuses to start without a
# non-empty value, because production must not silently run the Birdeye feed
# in its disabled state. Local/non-production runs still degrade to that
# disabled state when the key is absent.

services:
  engine:
    env_file:
      - .env
      # Secrets file — create .env.prod for API keys and credentials
      # (HELIUS_API_KEY, ETHERSCAN_API_KEY, NTFY_TOPIC, BIRDEYE_API_KEY, ...).
      # The production command also passes it as --env-file so compose can
      # interpolate the required BIRDEYE_API_KEY below.
      - path: .env.prod
        required: false
    environment:
      # Fail closed: compose aborts if BIRDEYE_API_KEY is unset or empty in
      # .env.prod, instead of deploying a feed that reports "disabled".
      BIRDEYE_API_KEY: ${BIRDEYE_API_KEY:?Set BIRDEYE_API_KEY in .env.prod before starting the production stack}
    read_only: true
    tmpfs:
      - /tmp
      - /app/.streamlit
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 2g
    cpus: 2.0
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  ollama:
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 4g
    cpus: 2.0
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backup:
    env_file:
      - .env
      - path: .env.prod
        required: false
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    cpus: 0.5
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
