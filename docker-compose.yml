services:
  # ── Full-stack engine (single container mode) ──────────────────────────
  engine:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      ENV: local
      API_HOST: 0.0.0.0
      API_BASE_URL: http://127.0.0.1:8000
      UI_HOST: 0.0.0.0
      ENGINE_ALLOW_LAN: "1"
      ENGINE_API_TOKEN: ${ENGINE_API_TOKEN:?Set ENGINE_API_TOKEN in .env before starting Compose}
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/serpent
      # Trained forecast models also persist in the data volume.
      MODEL_ARTIFACT_DIR: /app/data/models
      # Provider settings can point to a llama-server reachable by this container.
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-180}
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8501:8501"
    volumes:
      - serpent-data:/app/data
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # ── Local LLM (Ollama) — supports the LLM ensemble layer ──────────────
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    healthcheck:
      # "ollama list" succeeds once the server is accepting requests.
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 5
    # Pull the configured model on first boot so the engine finds it ready.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        sleep 3
        ollama pull $${LLM_MODEL:-qwen2.5:7b} || true
        wait

  # ── CI smoke-test dependencies (postgres/redis/minio for archive-parity) ──
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: serpent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Backup sidecar: SQLite + archive snapshots, 7-day retention ───────
  backup:
    build: .
    command: python scripts/backup.py --loop
    environment:
      BACKUP_DB_PATH: /app/data/serpent.db
      BACKUP_ARCHIVE_DIR: /app/data/archive
      BACKUP_DIR: /app/backups
      BACKUP_RETENTION_DAYS: "7"
      BACKUP_INTERVAL_HOURS: "24"
    volumes:
      - serpent-data:/app/data
      - serpent-backups:/app/backups
    restart: unless-stopped
    depends_on:
      engine:
        condition: service_healthy

