services:
  # ── Full-stack engine (single container mode) ──────────────────────────
  engine:
    build: .
    env_file: .env
    environment:
      ENV: local-single
      # SQLite must live in the persistent data volume, not the container
      # rootfs, or the DB is lost on every container recreation.
      DATABASE_URL: sqlite:////app/data/serpent.db
      # Trained forecast models also persist in the data volume.
      MODEL_ARTIFACT_DIR: /app/data/models
      # Ollama runs as its own container on the compose network.
      LLM_OLLAMA_URL: http://ollama:11434
    ports:
      - "8000:8000"
      - "8501:8501"
    volumes:
      - serpent-data:/app/data
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # ── Local LLM (Ollama) — supports the LLM ensemble layer ──────────────
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    healthcheck:
      # "ollama list" succeeds once the server is accepting requests.
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 5
    # Pull the default model on first boot so the engine finds it ready.
    # (Downloads qwen2.5:0.5b once into the volume; override with
    # OLLAMA_MODEL / MODEL env on the compose command if desired.)
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        sleep 3
        ollama pull $${OLLAMA_MODEL:-qwen2.5:0.5b} || true
        wait

  # ── Backup sidecar: SQLite + archive snapshots, 7-day retention ───────
  backup:
    build: .
    command: python scripts/backup.py --loop
    environment:
      BACKUP_DB_PATH: /app/data/serpent.db
      BACKUP_ARCHIVE_DIR: /app/data/archive
      BACKUP_DIR: /app/backups
      BACKUP_RETENTION_DAYS: "7"
      BACKUP_INTERVAL_HOURS: "24"
    volumes:
      - serpent-data:/app/data
      - serpent-backups:/app/backups
    restart: unless-stopped
    depends_on:
      engine:
        condition: service_healthy

