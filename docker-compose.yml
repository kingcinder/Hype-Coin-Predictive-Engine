services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-serpent}
      POSTGRES_USER: ${POSTGRES_USER:-serpent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-serpent}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-serpent} -d ${POSTGRES_DB:-serpent}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    env_file: .env
    command: alembic -c storage/alembic.ini upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    env_file: .env
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build: .
    env_file: .env
    command: python -m ingestion.worker --loop
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  ui:
    build: .
    env_file: .env
    command: streamlit run ui/app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres-data:
  minio-data:

