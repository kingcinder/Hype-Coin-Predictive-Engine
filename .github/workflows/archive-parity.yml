name: Archive and parity

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  moto-s3:
    name: Moto S3 archive suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run moto S3 tests
        run: python -m pytest tests/test_archive_s3.py -q

  docker-minio-parity:
    name: Docker MinIO archive and parity smoke
    runs-on: ubuntu-latest
    env:
      ENV: local
      DATABASE_URL: postgresql+psycopg://serpent:serpent@postgres:5432/serpent
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: raw-evidence
      ARCHIVE_BACKEND: s3
      ARCHIVE_ENABLED: "true"
      PARITY_ENABLED: "true"
      NTFY_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Pull dependency images (retried)
        run: |
          # Shared runners hit third-party registry flakes (quay.io 401s on a
          # healthy commit, 2026-09-25). Retry pulls with backoff so a
          # registry-side error cannot fail the gate; the final attempt fails
          # honestly.
          for attempt in 1 2 3 4 5; do
            if docker compose -f docker-compose.ci.yml pull postgres redis minio createbuckets; then
              exit 0
            fi
            echo "image pull failed (attempt $attempt/5); backing off before retry"
            [ "$attempt" -eq 5 ] && exit 1
            sleep $((attempt * 60))
          done
      - name: Start Docker profile dependencies
        run: docker compose -f docker-compose.ci.yml up -d postgres redis minio
      - name: Wait for MinIO
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:9000/minio/health/live >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Run migrations
        run: docker compose -f docker-compose.ci.yml run --rm migrate
      - name: Seed Docker profile fixture data
        # scripts/ is excluded from the Docker image by .dockerignore (keeps
        # the runtime image lean), so mount it read-only for this one-shot.
        run: docker compose -f docker-compose.ci.yml run --rm -v ./scripts:/app/scripts:ro worker python scripts/seed_fixtures.py
      - name: Run live MinIO archive smoke
        run: |
          docker compose -f docker-compose.ci.yml run --rm worker python -m ops.archive --once
      - name: Run parity against Docker MinIO profile
        run: docker compose -f docker-compose.ci.yml run --rm worker python -m ops.parity --once
      - name: Show dependency logs on failure
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs --no-color minio postgres migrate
      - name: Stop Docker profile
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v
