name: Archive and parity

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  moto-s3:
    name: Moto S3 archive suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run moto S3 tests
        run: python -m pytest tests/test_archive_s3.py -q

  docker-minio-parity:
    name: Docker MinIO archive and parity smoke
    runs-on: ubuntu-latest
    env:
      ENV: local
      DATABASE_URL: postgresql+psycopg://serpent:serpent@postgres:5432/serpent
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: raw-evidence
      ARCHIVE_BACKEND: s3
      ARCHIVE_ENABLED: "true"
      PARITY_ENABLED: "true"
      NTFY_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Start Docker profile dependencies
        run: docker compose up -d postgres redis minio
      - name: Wait for MinIO
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:9000/minio/health/live >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Run migrations
        run: docker compose run --rm migrate
      - name: Seed Docker profile fixture data
        run: docker compose run --rm worker python scripts/seed_fixtures.py
      - name: Run live MinIO archive smoke
        run: |
          docker compose run --rm worker python -m ops.archive --once
      - name: Run parity against Docker MinIO profile
        run: docker compose run --rm worker python -m ops.parity --once
      - name: Show dependency logs on failure
        if: failure()
        run: docker compose logs --no-color minio postgres migrate
      - name: Stop Docker profile
        if: always()
        run: docker compose down -v
