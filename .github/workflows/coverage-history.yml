name: Coverage history

on:
  schedule:
    - cron: "17 4 * * 1"   # weekly: Monday 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"

# Renders coverage/trend.svg (embedded in the README) so the coverage
# trajectory is visible on the repo page without opening Codecov.
permissions:
  contents: write

jobs:
  coverage-history:
    name: Record coverage trend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run pytest with coverage
        run: python -m pytest tests/ -q --cov=. --cov-report=xml
      - name: Append coverage to history and render trend
        run: python scripts/coverage_history.py
      - name: Commit updated history + trend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage/history.json coverage/trend.svg
          git diff --cached --quiet || git commit -m "chore(coverage): update trend chart [skip ci]"
          git push
