name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Required status checks for branch protection (GitHub Settings > Branches):
#   "Lint & Format", "Type Check (mypy)", "Tests", "Docker build",
#   "History guard"
# The "Rescore CLI smoke (throwaway DB)" job below is recommended as a status
# check too: it drives the migration CLI's real __main__ against a throwaway
# DB on every PR, so a regression in the write path fails fast in CI.
# While in the protection rule, also disable "Allow force pushes" and "Allow
# deletions" for main: the "History guard" job is only a CI backstop (the
# pre-push hook `check-history-divergence` catches a diverged push locally,
# but hooks are skippable with --no-verify); branch protection is what
# actually rejects the rewrite at the ref level. Every job below must pass
# before a PR can merge — enabling the protection rule is the final,
# repo-owner step (Settings cannot be set from a file).

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - name: Install dependencies
        run: python -m venv .venv && .venv/bin/pip install -e ".[dev]"
      - name: Ruff format check
        run: .venv/bin/ruff format --check .
      - name: Ruff lint check
        run: .venv/bin/ruff check .
      # Collection guard: fails if any repo-local import is dangling (e.g. the
      # historical `from storage.schema import metadata`, which broke pytest
      # collection for the whole suite) OR — with --venv — if any source file
      # imports a package that isn't installed in this job's venv, so a WIP
      # picking up a not-yet-added dependency fails lint, not just Tests. The
      # script itself stays stdlib-only; --venv adds site-packages resolution
      # against the deps installed above.
      - name: Broken-import scan
        run: .venv/bin/python scripts/check_broken_imports.py --venv .venv
      # Dependency-declaration guard: fails if any source file imports a
      # third-party root that isn't declared in pyproject.toml
      # ([project.dependencies] or an optional-dependencies group) or
      # registered in KNOWN_VENV_ABSENT — a manually- or transitively-
      # installed package can no longer drift silently into the tree, only to
      # break a fresh `pip install -e ".[dev]"` in the Tests job later.
      - name: Dependency-declaration scan
        run: .venv/bin/python scripts/check_declared_deps.py

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run mypy
        run: mypy api/ common/ engine/ crawlers/ data_lake/ ui/

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run pytest with coverage
        run: python -m pytest tests/ -x -q --cov=. --cov-report=term-missing --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: core

  rescore-smoke:
    name: Rescore CLI smoke (throwaway DB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - name: Install dependencies
        run: python -m venv .venv && .venv/bin/pip install -e ".[dev]"
      - name: Bootstrap + seed throwaway DB
        env:
          ENV: local-single
          SERPENT_DB_PATH: ${{ runner.temp }}/rescore-smoke.db
          LLM_ENABLED: "false"  # no Ollama in CI; the seed's scoring must stay hermetic
        run: |
          rm -f "$SERPENT_DB_PATH" "$SERPENT_DB_PATH-wal" "$SERPENT_DB_PATH-shm"
          .venv/bin/python scripts/bootstrap_local.py
          .venv/bin/python scripts/seed_fixtures.py
      - name: Rescore read-only (--compare --dry-run)
        env:
          ENV: local-single
          SERPENT_DB_PATH: ${{ runner.temp }}/rescore-smoke.db
          LLM_ENABLED: "false"
        run: |
          .venv/bin/python scripts/rescore.py --compare --dry-run > /tmp/rescore-dry.log 2>&1
          grep -q "Rescore complete (DRY RUN)" /tmp/rescore-dry.log
          if grep -q "Rescore complete (APPLIED)" /tmp/rescore-dry.log; then
            echo "read-only rescore pass wrote to the throwaway DB" >&2
            exit 1
          fi
      - name: Rescore for real (write path)
        env:
          ENV: local-single
          SERPENT_DB_PATH: ${{ runner.temp }}/rescore-smoke.db
          LLM_ENABLED: "false"
        run: |
          .venv/bin/python scripts/rescore.py --yes > /tmp/rescore-apply.log 2>&1
          grep -q "Rescore complete (APPLIED)" /tmp/rescore-apply.log
          # The seed fixture has exactly 2 scored tokens and every row carries
          # features, so the write loop must update both with zero errors — the
          # deterministic proof that rescore *persisted*, not just that the DB
          # is non-empty (those counts come from seed_fixtures). If
          # seed_fixtures ever gains another scored token, update the greps.
          grep -q "Updated: 2," /tmp/rescore-apply.log
          grep -q "Errors: 0" /tmp/rescore-apply.log
      - name: Assert throwaway DB is non-empty
        run: |
          .venv/bin/python - <<'EOF'
          import sqlite3

          conn = sqlite3.connect("${{ runner.temp }}/rescore-smoke.db")
          counts = {
              t: int(conn.execute(f"SELECT COUNT(*) FROM {t}").fetchone()[0])
              for t in ("assets", "chains", "scores", "market_snapshots")
          }
          print("throwaway DB counts:", counts)
          assert counts["assets"] >= 3, counts
          assert counts["chains"] >= 1, counts
          assert counts["scores"] >= 2, counts
          assert counts["market_snapshots"] >= 6, counts
          EOF
      - name: Assert real suite still collects
        run: |
          .venv/bin/python -m pytest tests/ --collect-only -q

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: serpent-hype-coin-engine:ci
      - name: Verify image metadata
        run: docker image inspect serpent-hype-coin-engine:ci --format "Image {{.Id}} built OK"

  history-guard:
    name: History guard
    runs-on: ubuntu-latest
    # Backstop for the pre-push hook (scripts/check_history_divergence.py):
    # fails the push-event run when the branch tip BEFORE the push is not an
    # ancestor of the new tip — the force-push signature. Hooks are skippable
    # (--no-verify, machines without `pre-commit install`); CI is not.
    # A deliberate rewrite carries [history-rewrite] in the head commit
    # message and passes loudly. Skipped on PRs: the merge push itself is what
    # moves main, and that arrives as a push event, which this job grades.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          # The guard resolves the pre-push tip (github.event.before) against
          # the new one; the default shallow clone (depth 1) would misreport
          # every fast-forward push as a rewrite because the old tip wouldn't
          # be in the fetched history.
          fetch-depth: 0
      - name: Verify push is a fast-forward
        run: |
          head_msg="$(git log -1 --format=%B)"
          python3 scripts/check_history_divergence.py --check \
            "${{ github.event.before }}" "${{ github.sha }}" \
            --commit-message "$head_msg"
